<p>comida-page works!</p>
<div class="_menu">
    <app-comida-card 
        *ngFor="let _food of menu; track: $index" 
        [food]="_food" 
        (click)="onCardClick(_food)"
        >
    </app-comida-card>
</div>

<app-modal 
    *ngIf="focusedFood"
    (onClose)="focusedFood = undefined"
    [Confirmation]="true"
    [Title]="'Modalzinho'"
    SaveLabel="Efetuar pedido"
    (onSave)="save()"
>
    
    <div class="modal-content">
        <img [src]="focusedFood?.image" alt="" height="100">
        <p>{{focusedFood?.description}}</p>
    </div>

        <h2>R$ {{focusedFood?.price}}</h2>

    <div class="quantidade">
        <h3>Quantidade: </h3>
        <button (click)="quantity = quantity-1">-</button>
        {{quantity}}
        <button (click)="quantity = quantity+1">+</button>
    </div>

</app-modal>
