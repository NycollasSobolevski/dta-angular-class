<header>
    <h1>Pixels</h1>
</header>

<main class="pixels-zone">
    
    @for (row of pixels; track $index) {
        <div class="row">
            @for (pixel of row; track $index) {
                <app-pixel [data]="pixel" (onChange)="updateData($event)" />
            }
        </div>
    }
</main>
